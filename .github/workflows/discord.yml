name: Discord Commit Notifications

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit notifications
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            const payload = context.payload;

            const repo = payload.repository.full_name;
            const repoName = payload.repository.name;
            const branch = payload.ref.replace("refs/heads/", "");
            const commits = payload.commits || [];

            const sender = payload.sender;
            const defaultAvatar = "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png";

            if (commits.length === 0) {
              return;
            }

            for (const commit of commits) {
              const sha = commit.id;

              const commitData = await github.rest.repos.getCommit({
                owner: payload.repository.owner.login,
                repo: repoName,
                ref: sha
              });

              // Skip merge commits
              if (commitData.data.parents.length > 1) {
                continue;
              }

              const shortSha = sha.substring(0, 7);

              const message =
                commit.message
                  .split("\n")[0]
                  ?.trim() ||
                "No commit message";

              // 1. Text display name (local Git name like "Epik" or "casual0developer")
              const displayName =
                commit.author?.name ||
                commitData.data.commit.author.name ||
                "Unknown";

              // 2. Real GitHub Account profile & avatar (from GitHub REST API)
              const githubUser = commitData.data.author;

              let authorAvatar = defaultAvatar;
              let authorUrl = `https://github.com/${displayName}`;

              if (githubUser) {
                // Verified GitHub profile found
                authorAvatar = githubUser.avatar_url;
                authorUrl = githubUser.html_url;
              } else if (commit.author?.username) {
                // Webhook fallback username
                authorAvatar = `https://github.com/${commit.author.username}.png`;
                authorUrl = `https://github.com/${commit.author.username}`;
              } else if (sender?.avatar_url) {
                // Ultimate fallback
                authorAvatar = sender.avatar_url;
              }

              const commitUrl =
                `https://github.com/${repo}/commit/${sha}`;

              const branchUrl =
                `https://github.com/${repo}/tree/${branch}`;

              const parentSha =
                commitData.data.parents[0]?.sha;

              const diffUrl = parentSha
                ? `https://github.com/${repo}/compare/${parentSha}...${sha}`
                : commitUrl;

              const pushedText =
                commits.length === 1
                  ? "1 commit pushed"
                  : `${commits.length} commits pushed`;

              const commitDate =
                new Date(commitData.data.commit.author.date)
                  .toLocaleString("en-US", {
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                  });

              const body = {
                username: "Captain Skid",

                embeds: [
                  {
                    author: {
                      name: `${displayName} pushed to ${repoName}`,
                      icon_url: authorAvatar,
                      url: authorUrl
                    },

                    description:
                      `**${pushedText} to [\`${branch}\`](${branchUrl})** · ` +
                      `[View diff](${diffUrl})\n` +
                      `📝 **${message}**\n` +
                      `\`${shortSha}\` · ${commitDate} · by **${displayName}**`,

                    color: 0x800080,

                    footer: {
                      text: "perplexity - GitHub"
                    },

                    timestamp: new Date().toISOString()
                  }
                ],

                allowed_mentions: {
                  parse: []
                }
              };

              const response = await fetch(webhook, {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify(body)
              });

              if (!response.ok) {
                const text = await response.text();

                core.setFailed(
                  `Discord returned ${response.status}: ${text}`
                );
              }
            }
