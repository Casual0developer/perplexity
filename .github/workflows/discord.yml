name: Discord Commit Notifications

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit notifications
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            const payload = context.payload;

            const repo = payload.repository.full_name;
            const repoName = payload.repository.name;
            const branch = payload.ref.replace("refs/heads/", "");
            const commits = payload.commits || [];

            const sender = payload.sender;
            const defaultAvatar = "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png";

            const userCache = {};

            if (commits.length === 0) {
              return;
            }

            for (const commit of commits) {
              const sha = commit.id;

              const commitData = await github.rest.repos.getCommit({
                owner: payload.repository.owner.login,
                repo: repoName,
                ref: sha
              });

              // Skip merge commits
              if (commitData.data.parents.length > 1) {
                continue;
              }

              const shortSha = sha.substring(0, 7);

              const message =
                commit.message
                  .split("\n")[0]
                  ?.trim() ||
                "No commit message";

              // 1. Exact raw name from the commit (e.g. "casual0developer" or "Epik")
              const rawAuthorName =
                commit.author?.name ||
                commitData.data.commit.author.name ||
                "Unknown";

              let authorUsername = rawAuthorName;
              let authorAvatar = defaultAvatar;
              let authorUrl = `https://github.com/${rawAuthorName}`;

              // 2. Try looking up the profile using the exact raw author name
              if (rawAuthorName !== "Unknown") {
                if (userCache[rawAuthorName]) {
                  authorAvatar = userCache[rawAuthorName].avatar;
                  authorUrl = userCache[rawAuthorName].url;
                  authorUsername = userCache[rawAuthorName].login;
                } else {
                  try {
                    // Query GitHub API for the user matching the exact author name string
                    const userRes = await github.rest.users.getByUsername({
                      username: rawAuthorName
                    });

                    if (userRes.data) {
                      authorAvatar = userRes.data.avatar_url;
                      authorUrl = userRes.data.html_url;
                      authorUsername = userRes.data.login;

                      userCache[rawAuthorName] = {
                        avatar: authorAvatar,
                        url: authorUrl,
                        login: authorUsername
                      };
                    }
                  } catch (e) {
                    // If no user matches rawAuthorName directly, fallback to commitData.data.author
                    if (commitData.data.author) {
                      authorAvatar = commitData.data.author.avatar_url;
                      authorUrl = commitData.data.author.html_url;
                      authorUsername = commitData.data.author.login;
                    } else {
                      authorAvatar = sender?.avatar_url || defaultAvatar;
                    }
                  }
                }
              }

              const commitUrl =
                `https://github.com/${repo}/commit/${sha}`;

              const branchUrl =
                `https://github.com/${repo}/tree/${branch}`;

              const parentSha =
                commitData.data.parents[0]?.sha;

              const diffUrl = parentSha
                ? `https://github.com/${repo}/compare/${parentSha}...${sha}`
                : commitUrl;

              const pushedText =
                commits.length === 1
                  ? "1 commit pushed"
                  : `${commits.length} commits pushed`;

              const commitDate =
                new Date(commitData.data.commit.author.date)
                  .toLocaleString("en-US", {
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                  });

              const body = {
                username: "Captain Skid",

                embeds: [
                  {
                    author: {
                      name: `${rawAuthorName} pushed to ${repoName}`,
                      icon_url: authorAvatar,
                      url: authorUrl
                    },

                    description:
                      `**${pushedText} to [\`${branch}\`](${branchUrl})** · ` +
                      `[View diff](${diffUrl})\n` +
                      `📝 **${message}**\n` +
                      `\`${shortSha}\` · ${commitDate} · by **${rawAuthorName}**`,

                    color: 0x800080,

                    footer: {
                      text: "perplexity - GitHub"
                    },

                    timestamp: new Date().toISOString()
                  }
                ],

                allowed_mentions: {
                  parse: []
                }
              };

              const response = await fetch(webhook, {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify(body)
              });

              if (!response.ok) {
                const text = await response.text();

                core.setFailed(
                  `Discord returned ${response.status}: ${text}`
                );
              }
            }
